---
# Keycloak lab manifest
# NOT FOR PRODUCTION USE
#
# Realm: llm-platform
# Client: agentgateway-client (secret: agentgateway-client-secret)
#
# Users:
#   dev-admin / admin-password  — developers group, llm-admin role
#   dev       / dev-password    — developers group, llm-user role
#   agent     / agent-password  — agents group,     llm-user role
#
# Note: Keycloak automatically creates a 'master' realm on startup.
# This is Keycloak's built-in administrative realm and is not used
# by agentgateway. All playbook configurations use 'llm-platform' only.

apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: keycloak
data:
  realm.json: |
    {
      "realm": "llm-platform",
      "enabled": true,
      "roles": {
        "realm": [
          { "name": "llm-admin", "description": "Full LLM access, no rate limits" },
          { "name": "llm-user",  "description": "Standard LLM access, rate limited" }
        ]
      },
      "clients": [
        {
          "clientId": "agentgateway-client",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "secret": "agentgateway-client-secret",
          "protocolMappers": [
            {
              "name": "agentgateway-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.custom.audience": "agentgateway",
                "access.token.claim": "true"
              }
            },
            {
              "name": "groups-mapper",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "groups",
                "full.path": "false",
                "access.token.claim": "true",
                "id.token.claim": "false",
                "userinfo.token.claim": "false"
              }
            },
            {
              "name": "roles-mapper",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "roles",
                "multivalued": "true",
                "access.token.claim": "true",
                "id.token.claim": "false",
                "userinfo.token.claim": "false"
              }
            }
          ]
        }
      ],
      "groups": [
        { "name": "developers" },
        { "name": "agents" }
      ],
      "users": [
        {
          "username": "dev-admin",
          "enabled": true,
          "credentials": [{"type": "password", "value": "admin-password", "temporary": false}],
          "groups": ["developers"],
          "realmRoles": ["llm-admin"]
        },
        {
          "username": "dev",
          "enabled": true,
          "credentials": [{"type": "password", "value": "dev-password", "temporary": false}],
          "groups": ["developers"],
          "realmRoles": ["llm-user"]
        },
        {
          "username": "agent",
          "enabled": true,
          "credentials": [{"type": "password", "value": "agent-password", "temporary": false}],
          "groups": ["agents"],
          "realmRoles": ["llm-user"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.1.3
          args:
            - start-dev
            - --import-realm
          env:
            - name: KEYCLOAK_ADMIN
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: "admin"
            - name: KC_PROXY
              value: "edge"
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import/
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /realms/llm-platform
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm-config
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
